name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Skip the bundled Chromium download: nothing in CI drives a browser.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: pnpm test

      - run: pnpm build

  # The native app (macos/), the Vision OCR worker the CLI uses on macOS, and
  # the app bundle only exist on macOS — the parts a Linux-only CI cannot say
  # anything about.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Before the tests: the CLI's Vision tests skip themselves unless
      # bin/kindle-ocr-macos exists, and the Swift tests load
      # dist-core/kindle-core.js — without a build both would quietly test less.
      - run: pnpm build

      - run: test -x bin/kindle-ocr-macos

      - run: test -s dist-core/kindle-core.js && test -s dist-core/app.html

      - run: pnpm test

      - run: swift test --package-path macos

      # Builds the Swift app in release mode, assembles and signs the bundle,
      # and checks it links only system libraries.
      - run: pnpm package

      # The native app's reason to exist is being small and self-contained; a
      # Node runtime or node_modules sneaking back in shows up here first.
      - name: Check the bundle
        run: |
          APP="dist-app/Book Export for Kindle.app"
          KB="$(du -sk "$APP" | cut -f1)"
          echo "bundle: $((KB / 1024)) MB"
          test "$KB" -lt $((30 * 1024))
          if find "$APP" \( -name node -o -name node_modules \) | grep .; then
            echo "the app bundle contains Node" >&2
            exit 1
          fi
